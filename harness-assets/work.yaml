tasks:
  - id: 1
    spec: 45
    implementation: |
      三個畫面（tgo Screen，Name、Key、Desc）：Tetru（T，the game）、Rank（R，the scores, best first）、Settings（S，the keys to play with）；
      tgo 畫最上面的畫面 chip 列與下面的線，T、R、S 是 global 熱鍵，global operation popup 裡也列出來
      Tetru 畫面只有一個 panel [1] PLAYGROUND，佔滿 panel 區（沒有 Screen.Layout）；右邊一欄由上而下 NEXT 1、NEXT 2（task 2）、INFO、KEYS（task 14）是 PLAYGROUND 的 body 畫的框（task 15）
      PLAYGROUND 裡分成左邊場地那一塊與右邊那一欄（ui split）：右邊那一欄固定 24 欄（INFO 的框 23 欄與離 PLAYGROUND 的框一格），放大兩倍時 27 欄（框 26 欄），場地那一塊拿剩下的
      （PLAYGROUND 裡 58 欄 34｜24、75 欄 51｜24、148 欄 124｜24）；NEXT 1、NEXT 2 的框各 6 列（放大時 10 列），從 PLAYGROUND 裡第一列起，INFO 的框 5 列，KEYS 的框拿剩下的到最後一列
      Level、Lines、Score 在 INFO（task 14）；場地那一塊裡只有場地；沒有 statusbar
      啟動時（tgo App.Start）用 tgo App.Focus 把 focus 放到 [1] PLAYGROUND
      最低尺寸 42×32（tgo App.MinWidth、MinHeight）；比它小時 tgo 只畫名稱、needs a terminal of at least 42×32、Press [Ctrl-C] twice to quit
      窄寬的門檻 60（tgo Screen.NarrowBelow）：42–59 欄 PLAYGROUND 不畫右邊那一欄，自己在場地上面寫兩行
      Level: 1   Lines: 0（Level 補到 2 格）與 Score: 0，空一行再畫場地，場地右邊畫接下來的方塊、沒有框（task 2）
      tdptest 在每一格畫面量每一列等於終端機寬度（tdp L4）；版面的測試在 icon 與 powerline 符號 1/1、2/1、2/2 格下各跑一次（tdp E5）
    test: [TestTetruScreen, TestScreensSwitchOnTRS, TestNarrowDrawsTheBoxesWithNoFrames, TestLeastSizeIsTheGameAlone, TestPictureGrowsTwiceOnALargeTerminal, TestStatsInInfo, TestFirstLaunch]
  - id: 2
    spec: 17
    implementation: |
      PLAYGROUND 的 body 自己畫（tgo Body），場地與兩格從同一張 19×24 像素的圖切出來；一個像素是 nf-fa-square（U+F0C8），icon 佔一格時後面補一個空白，所以一個像素 2 欄 × 1 列
      圖：場地 12×24（task 3），沒有框，空的地方畫像素，#313244（locku 的底）；隔一個像素是一欄兩格，各寬 6、高 4 像素的底、沒有框，兩格之間隔一個像素；
      每格置中畫一個接下來的方塊（三格寬的放不正中，偏左），一個方塊一個像素，第一格是下一個（game.Queue 是 2）
      方塊的顏色：I #89dceb、O #f9e2af、T #cba6f7、S #a6e3a1、Z #f38ba8、J #89b4fa、L #fab387
      PLAYGROUND 畫場地（左邊 12 像素），置中在場地那一塊；右邊那一欄的 NEXT 1、NEXT 2 框裡各畫自己那一格（右邊 6 像素、4 像素高），置中（task 15）
      窄寬（42–59 欄）時 PLAYGROUND 畫整張圖，場地右邊隔一個像素是兩格，沒有框
      場地那一塊放得下 48 欄、PLAYGROUND 裡放得下 48 列、框裡放得下 24 欄、PLAYGROUND 裡的高放得下右邊那一欄時，場地與兩格一起把一個像素畫成 2×2，NEXT 的框跟著變高；不然都不放大
      還沒玩過時畫空的場地與空的兩格
      顏色用 tgo 的 Fg 上色；被 popup 蓋住時由 tgo 淡化（PLAYGROUND 是唯一的 panel，一直有 focus）
    test: [TestPictureIsLockus, TestTetruScreen, TestNarrowDrawsTheBoxesWithNoFrames, TestPictureGrowsTwiceOnALargeTerminal, TestPopupsOverTheGameAtEveryWidth]
  - id: 3
    spec: 9
    implementation: |
      遊戲在 internal/game，不碰終端機：場地 12 格寬、24 格高（game.Cols、game.Rows）
      七種方塊（locku 的 art 與轉法），七個一袋、袋裡打亂；新方塊的最上面一列在場地第一列、左右置中（3 格寬的偏左半格）；放不進去就結束
      每一格往下的時間照關卡：1000、800、650、520、420、330、260、200、150、100 ms；每消 10 行升一關，到第 10 關為止
      碰到底後 500 ms 固定；這段時間裡移動、旋轉成功就重算，最多 15 次
      旋轉在方塊自己的框裡轉；轉不過去依序試左 1、右 1、上 1，長條再試左 2、右 2
      分數：一次消 1–4 行 100、300、500、800 乘當時的關卡；往下一格 1 分，落到底每一格 2 分
      固定時有一格在場地上方就結束
      tgo App.Tick 每 40 ms 一格推進遊戲（README 的計時器）；消行時每 16 ms 一格（task 9）
    test: [TestPiecesComeSevenToABag, TestSameSeedSameGame, TestPieceComesInAtTheTopInTheMiddle, TestMoveStopsAtTheWalls, TestRotateTurnsAndComesBack, TestRotateKicksOffTheWall, TestDownScoresARow, TestDropSetsThePieceAndScoresTwoARow, TestGravityAtTheLevelsSpeed, TestLockWaitsAndMovingRestartsIt, TestLockResetsRunOut, TestClearScoresAtTheLevelAndGoesUp, TestTheSpeedStopsAtTheLastLevel, TestTheStackAtTheTopEnds, TestEndStopsThePiece, TestTheGameFalls]
  - id: 4
    spec: 50
    implementation: |
      開始或繼續一局時，PLAYGROUND 進入 tgo 的模式 Gaming（tgo Panel.EnterMode）：tgo 把外框換成模式色、上框右邊畫 ┫Gaming┣
      Gaming 的鍵（tgo ModeKey）照 Settings 的鍵（task 13），預設：h、← 左一格；l、→ 右一格；j、↓ 往下一格；d、PgDn 左旋（逆時針）；k、↑ 右旋（順時針）；
      Enter 落到底並固定；沒有方塊可動時（消行中、結束之後）這六個鍵停用（tgo ModeKey.Disabled，footer 與 ? 是停用色）；一個動作的鍵是 h、j、k、l、u、d 時，它的方向鍵（←、↓、↑、→）或 PgUp、PgDn 做一樣的事，鍵改成別的字母時就不作用
      footer 由 tgo 寫：Space:menu ?:help d:rotate left k:rotate right Enter:drop r:restart q:quit Esc:pause；左右、往下標成不進 footer（tgo ModeKey.NoFooter），放不下的由 tgo 省略、Esc:pause 留著；這些鍵都在 ?，不在 Space menu（task 5）
      Gaming 裡 PLAYGROUND 的下框不寫 hint（Enter 的 hint 拿掉；panel 上沒有按得動的鍵）
      Enter 在 PLAYGROUND 上（Gaming 外）：沒有一局在暫停時開新的一局（task 6），有就繼續（task 5）；hint Enter:play，暫停時 Enter:resume
    test: [TestPlay, TestTheGamingFooterHasTheTurnsAndTheDrop, TestSpaceMenuRunsRestartAndTheKeysAreInHelp, TestTheGameFalls, TestSettingsSetAKey]
  - id: 5
    spec: 52
    implementation: |
      Gaming 裡按 Space：tgo 開 Gaming 的 Space menu，標題 [1] PLAYGROUND，只有 GAMING MODE 的 [r]estart（start over from level 1）、
      [q]uit（leave tetru; a game going goes on next time），選了 [r]estart 就等於按 r，選了 [q]uit 就是 task 10 的離開流程；玩的六個鍵標 tgo ModeKey.NoMenu、模式標 Mode.NoLeaveRow
      （tgo v1.2.4 起），都不列，[Esc] Pause 也不列；q 是 core key：沒有 Do 的 tgo ModeKey {Key: q, Desc: quit, Label: Quit}（tgo v1.2.5），按 q 或選 [q]uit 都是 tgo 的離開流程；? 列 Gaming 的每個鍵（照 Settings 裡現在的鍵）、r 與 Esc，q 列在 core key 裡一次
      Gaming 模式的 r：跟 PLAYGROUND 的 n 一樣（值得記的先開 NEW GAME 問誰玩的，不然直接開新的一局）；q：task 10 的離開流程（q 本來就是 core key）；沒有 s（Save 拿掉了，task 16）；footer 是
      Space:menu ?:help d:rotate left k:rotate right Enter:drop r:restart q:quit Esc:pause（task 4），窄的終端機放不下的由 tgo 收掉，Esc:pause 留著
      遊戲每 40 ms 一格，有任何 popup 開著（Space menu、?、confirm）或終端機比 42×32 小時不往前走，popup 關掉就接著走；有沒有 popup 是問
      tgo App.Covered()（收起動畫播到一半、splash 開著也算）
      Esc 離開 Gaming（tgo Mode.OnExit）：遊戲停著，開 tgo App.Confirm：標題 RESUME，內容 Paused: level 1, 0 lines, 0 points.，問句 Go on with the game?，
      Enter:resume 回到 Gaming，Esc:cancel 留在暫停；場地上不畫東西（第一版畫的兩條直槓拿掉了）
      暫停時 PLAYGROUND 的 hint 是 Enter:resume；Space menu 是一般的：
      PANEL OPERATION 的 [Enter] Resume（this game, where it was）、[n]ew game、[x] End game，與 Global operation（沒有 Save，task 16）；Enter 回到 Gaming
      Tab、數字鍵在 Gaming 裡不暫停（tgo Mode.Pause 沒設）：只有一個 panel，tgo 換 panel 時不做事、不出聲
      Settings 沒有 Pause 那一列（task 13）；INFO 寫 Space menu、Esc pause（task 14）
    test: [TestTheGameStopsUnderAPopup, TestEscPausesEnterResumes, TestTabInPlayDoesNothing, TestSpaceMenuRunsRestartAndTheKeysAreInHelp, TestSettingsHaveNoPauseRow, TestRestartFromThePlayModesSpaceMenu, TestPlay]
  - id: 6
    spec: 47
    implementation: |
      PLAYGROUND 上按 Enter（沒有暫停中的一局時）直接開一局、進 Gaming，不問名字
      一局值得記（有分數、擠得進前二十名：scores.Makes，task 7）時，結束的時候開 tgo 的 text input 問誰玩的：Prompt 是 12,340 points: who played?，建議值（tgo TextInput.Suggest）ANON，
      hint 有 Tab:edit Backspace:clear；最多 16 個字（tgo TextInput.MaxLen）；Enter 用打的名字（去掉前後空白），沒打、清空了都是 ANON
      名字有錯時錯誤訊息叫它 Name（tgo TextInput.Name）；堆到頂：灰幕落完時先照 ANON 記下（App Log 記一筆 Success），才開，標題 KEEP SCORE、內容 Game over, 12,340 points: who played?、Enter:keep Esc:cancel；
      Enter 把剛記下的那一筆換成打的名字、寫回 scores.yaml（App Log：Kept 12,340 points for amy, not ANON），沒打、清空就留 ANON；Esc 不改名，那一筆照樣是 ANON；
      灰幕落下到記下之前，PLAYGROUND 的 Enter 與 [n]ew game 停用（tgo Action.Disabled），Enter:play 的 hint 拿掉，記下之後回來
      [x] End game、[n]ew game、離開流程：見 task 10
      不值得記的局不問、不記；[x] End game 時有分數的跳 tgo Info toast：150 points, not in the best 20, so nothing is kept.；重新開始（Gaming 的 r、[n]ew game）時什麼都不說，直接重開
    test: [TestNameIsAskedAsTheGameEnds, TestNameTypedIsKept, TestEscOnTheNameKeepsAnon, TestNameWithTrickyCharacters, TestNoPointsNotKept, TestRankKeepsTheBestTwentyWithTheirPlaces]
  - id: 7
    spec: 47
    implementation: |
      分數存在 TETRU__DATA 或 ~/.tetru 底下的 scores.yaml：scores 底下一筆一個 {time, name, score}，time 是 RFC 3339、到秒，照記下的順序；
      每次整個檔重寫（先寫暫存檔再改名），目錄 0755、檔 0644
      一局結束、問了誰玩的之後記一筆（task 6、10），一局只記一次；中途離開（q、Ctrl-C）不記，那一局存起來（task 16）；main 在 tgo App.Run 結束後（連按兩次 Ctrl-C、關掉終端機），
      還在玩的那一局存起來（task 16），存不起來的與結束了還沒記的才記成 ANON；不值得記的不記；存起來的不記
      只留前二十名（scores.Most、scores.Best）：記下一筆後超過 20 筆就刪掉最後一名，整個檔重寫；值得記是有分數、比第二十名高或還不到 20 筆（scores.Makes）；
      啟動時讀到超過 20 筆，記憶體裡只留前二十名，下次記分時檔案才剪
      關掉終端機（SIGHUP）：tgo 的 Run 正常回來，main 在 Run 之後照樣記
      記下時 App Log 記一筆 Success：Kept 12,340 points for vulcan；寫不進去開 error popup：Can't keep the score，檔案路徑與原因
      啟動時 scores.yaml 讀不了：tgo App.MoveAside 問要不要移成 scores.yaml.bak 重新開始；Enter 移開、從空的排行開始，Esc 離開
    test: [TestPathIsInTheDataDirectory, TestSaveThenLoad, TestLoadBroken, TestBestKeepsTheTwenty, TestRankKeepsTheBestTwentyWithTheirPlaces, TestTopOutKeepsTheScore, TestNoPointsNotKept, TestFinishKeepsTheGameGoing, TestQuitKeepsTheGameGoing, TestQuitThatCantSaveSaysSo, TestBrokenScoresAskToMoveAside]
  - id: 8
    spec: 44
    implementation: |
      Rank 畫面只有 [1] RANK，tgo List：#（名次，1 起，數字靠右）、NAME（可截短，最少 6 格）、SCORE（數字靠右，每三位一個逗號）、TIME（2006-01-02 15:04，本地時間，放不下第一個拿掉）
      footer 由 tgo 寫只有一個 panel 的那一種：Space:menu ?:help !:log q:quit
      順序：分數高的在前，同分時間早的在前；不能排序、不能篩選
      記下一筆後 cursor 移到那一筆（tgo List.Select），畫面與 focus 不換
      前三名整列的字上色（tgo Row.Styled）：Yellow #f9e2af、Green #a6e3a1、Sky #89dceb；cursor 停在這三列時 tgo Row.CursorColor 給那一列的顏色（tgo v1.2.4）：色塊與箭頭是那個顏色，字 Base 粗體，淡化與模式裡改回 Subtext1 由 tgo 做
      空的時候：No scores yet / Press [T] to play
      沒有 Enter 與其他動作；j|k、gg|G 由 tgo 移動
    test: [TestScoresBestFirst, TestTopOutKeepsTheScore, TestScreensSwitchOnTRS, TestRankKeepsTheBestTwentyWithTheirPlaces, TestRankColoursTheFirstThree]
  - id: 9
    spec: 52
    implementation: |
      消行：方塊落定、湊滿的那一刻，滿的那幾行離開堆疊，行數與分數馬上加（關卡跟著升），下一個方塊同時出現在最上面等著
      不管消幾行：先整塊 #ffffff 100 ms（game.Flash），再照消幾行畫哪一種走法（ui clearRows；game.Along 是全部一起走了多遠，幾行都是一起走），都是 #ffffff，走掉的地方畫底：
      1 行：原地從 #ffffff 分四段（#ccccd0、#9899a2、#656573）淡成底色，200 ms
      2 行：每一格照離兩行正中心的步數分圈，中心那圈先畫底，一圈一圈往外，250 ms
      3 行：每一格照固定的亂序（crumble）在 300 ms 裡輪到時碎掉：閃白一過第一格就開始，最後一格約在 206 ms 開始；每一格 75 ms 依序換成 U+F0D7C（nf-md-grain）、U+F00B5（nf-md-blur），再畫底
      4 行：四行一起，350 ms：閃白一過每一格同時換成 U+F0D7C（nf-md-grain），40% 起每一格同時換成 U+F00B5（nf-md-blur），都留在原地；60% 起每一格同時換成 U+F01D8（nf-md-dots_horizontal），左半往左、右半往右滑（右半到右邊那一欄前面就不畫，窄寬時到場地右牆）
      全部走完 20 ms 後（game.Settle），上面的整片一次降下補滿空行（game.ClearTime）；最上面補空的格子；等著的方塊不跟著降
      這段期間 Gaming 玩的六個鍵停用（tgo ModeKey.Disabled：still，沒有方塊可動，footer 與 ? 是停用色），方塊也不往下掉；降完方塊才開始掉，放不進去就結束（堆到頂）；有 popup 蓋著時動畫停著
      結束：方塊由上往下一列像素一列像素變成框的灰，5 秒蓋滿整張圖（場地與兩格），灰的留著，場地上不寫字（第一版的紅色 END 拿掉了）
      堆到頂結束的，還在 Gaming 裡（不 LeaveMode）落灰幕：玩的六個鍵停用（still），r 停用到記下為止（waiting）；灰幕中 Esc 照樣離開 Gaming（OnExit 的 pause 看到沒有一局可接著玩，不開 RESUME），灰幕落完的 popup 就開在 PLAYGROUND 上；灰幕落完才開 popup：值得記的問誰玩的（task 6）；不值得記的開 tgo App.Confirm：標題 PLAY，內容 Game over: no points, so nothing is kept.（擠不進前二十名：Game over: 150 points, not in the best 20, so nothing is kept.），
      問句 Play again?，Enter:play 開下一局（還在 Gaming），Esc:cancel 只關掉 popup、還在 Gaming；KEEP SCORE 上 Enter 記下之後離開 Gaming（leaveOver，回到 PLAYGROUND，Enter:play），Esc 只關掉 popup；還在 Gaming 時再按 Esc 才離開，r 開下一局；[x] End game、[n]ew game 結束的不開
      兩段動畫都由 tgo App.Tick 推：消行時每 16 ms 一格，灰幕每 40 ms 一格；消 1 行 0.32 秒、2 行 0.37、3 行 0.42、4 行 0.47 秒（game.ClearTime）；灰幕不管有沒有 popup 都照走
    test: [TestOneRowFlashesFadesThenTheStackComesDown, TestClearsByHowManyRows, TestFourBurstThenTheStackComesDownAtOnce, TestClearSlidesThenTheStackComesDown, TestClearScoresAtTheLevelAndGoesUp, TestTopOutKeepsTheScore, TestTheStackAtTheTopEnds, TestTopOutWithNoPoints, TestNoPointsNotKept, TestNameIsAskedAsTheGameEnds, TestEscOnTheNameKeepsAnon]
  - id: 10
    spec: 47
    implementation: |
      PLAYGROUND 的 panel operation（Gaming 外的 Space menu 與熱鍵）：
      [n]ew game（start over from level 1）：有一局值得記時先開 task 6 的 text input，標題 NEW GAME、Enter:start；Enter 記下那一局，接著開新的一局、進 Gaming；
      Esc 回到遊戲；不值得記或沒有一局時直接開新的一局
      [x] End game（keep this score and stop）：有一局值得記時先開同樣的 text input，標題 END GAME、Enter:end；Enter 記下、結束、灰幕開始，
      灰幕落完不再問；Esc 回到遊戲；不值得記時直接結束；沒有一局時停用
      離開流程（tgo App.QuitFlow、QuitDesc leave tetru; a game going goes on next time）：不問。有一局在玩（玩著或暫停中）時回一個訊息（quitKeep），
      收到時把這一局存起來（task 16）、回 tea.Quit；沒有一局在玩時直接回 tea.Quit。有 popup 開著時 tgo 先開 Quit tetru?，Enter 才送出那個訊息，Esc 什麼都沒存
      存不起來：tgo App.Error 開 CAN'T SAVE THE GAME，路徑與原因、[Ctrl-C] twice quits all the same, the score so far kept for ANON.，不離開；離開流程中再按一次 Ctrl-C 由 tgo 立刻離開（main 的 Finish 存起來）
    test: [TestEndGameAsksAndKeeps, TestNewGameAsksWhoPlayed, TestQuitKeepsTheGameGoing, TestQuitUnderAPopupAsksFirst, TestQuitFromTheGamingMenu, TestQuitThatCantSaveSaysSo, TestQuitWithNoGameLeaves, TestNoPointsNotKept, TestRestartNotInTheRankSaysNothing]
  - id: 11
    spec: 40
    implementation: |
      docs/icon.svg：U 框照 tdp principle/icon.svg（#205090），金色（#f2b753）的字在框裡上排 T、E，下排 T、R，一個字 6×7 格、筆畫兩格粗（kamonu 匯出的 tetru.svg）；註解依序 U、T、E、T、R
      internal/ui/icon.svg 是它的副本，embed 給 tgo 的 splash（tgo NewSplash：tetru、internal/version 的 Display()、A falling-block game for the terminal）
      命令列：tetru version、-v、--version 印 Display()；tetru help、-h、--help 印用法（含分數與存檔的位置）；其他字印 unknown command 與用法，exit 2
    test: [TestSplashIsTheIcon, TestVersionAndHelp, TestFirstLaunch]
  - id: 12
    spec: 43
    implementation: |
      repo 照 harness project.3；family.mk、release.yml、.goreleaser.yaml、install.sh、uninstall.sh、internal/version/version.go、.gitignore 照 harness 範本，
      只改表上允許的地方（goreleaser 的 description、caveats 寫分數的位置）；出 Windows 版：.goreleaser.yaml 打開標著 Windows 的註解（scoop 的 description 同 brews 的），
      release.yml 的 matrix 加 windows-latest（Windows 跑 go test，不帶 -race），install.sh 的 WINDOWS="yes"
      install.ps1、uninstall.ps1（照 ccdrawu 的寫法）：執行檔裝在 %LOCALAPPDATA%\tetru、加進使用者的 PATH；移除時拿掉執行檔與 PATH，再逐一問要不要刪
      設定（TETRU__CONFIG、$XDG_CONFIG_HOME\tetru 或 %USERPROFILE%\.config\tetru）與資料（TETRU__DATA 或 %USERPROFILE%\.tetru）
