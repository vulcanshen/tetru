tasks:
  - id: 1
    spec: 5
    implementation: |
      三個畫面（tgo Screen，Name、Key、Desc）：Tetru（T，the game）、Rank（R，the scores, best first）、Settings（S，the keys to play with）；
      tgo 畫最上面的畫面 chip 列與下面的線，T、R、S 是 global 熱鍵，global operation popup 裡也列出來
      Tetru 畫面四個 panel，tgo Screen.Layout：左邊 [1] GAME（task 2）；右邊一欄由上而下 [2] NEXT 1、[3] NEXT 2（task 2）、[4] INFO（task 14）
      右邊那一欄寬是整個寬度的三分之一、至少 23 欄（INFO 的字與框），GAME 拿剩下的（60 欄 37｜23、77 欄 52｜25、150 欄 100｜50）；
      NEXT 1、NEXT 2 各 6 列（放大時 10 列），INFO 拿剩下的
      Level、Lines、Score 在 INFO 上面那一段（task 14）；GAME 裡只有場地；沒有 statusbar
      啟動時（tgo App.Start）用 tgo App.Focus 把 focus 放到 [1] GAME
      最低尺寸 42×29（tgo App.MinWidth、MinHeight）；比它小時 tgo 只畫名稱、needs a terminal of at least 42×29、Press [Ctrl-C] twice to quit
      窄寬的門檻 60（tgo Screen.NarrowBelow）：42–59 欄只畫有 focus 的 panel；玩的時候 focus 在 GAME，NEXT 與 INFO 收掉、GAME 自己在場地上面寫一行
      Level: 1   Lines: 0  Score: 0（Level 補到 2 格），場地右邊畫接下來的方塊（task 2）；Tab 依序只畫 NEXT 1、NEXT 2、INFO
      tdptest 在每一格畫面量每一列等於終端機寬度（tdp L4）；版面的測試在 icon 與 powerline 符號 1/1、2/1、2/2 格下各跑一次（tdp E5）
    test: [TestTetruScreen, TestScreensSwitchOnTRS, TestNarrowShowsTheFocusedPanelOnly, TestLeastSizeIsTheGameAlone, TestPictureGrowsTwiceOnALargeTerminal, TestStatsInInfo, TestFirstLaunch]
  - id: 2
    spec: 5
    implementation: |
      GAME 與 NEXT 1、NEXT 2 的 body 自己畫（tgo Body），從同一張 17×20 像素的圖切出來；一個像素是 nf-fa-square（U+F0C8），icon 佔一格時後面補一個空白，所以一個像素 2 欄 × 1 列
      圖：場地 10×20，沒有框，空的地方畫像素，#313244（locku 的底）；隔一個像素是一欄兩格，各 6×4 像素的底、沒有框，兩格之間隔一個像素；
      每格置中畫一個接下來的方塊，一個方塊一個像素，第一格是下一個（game.Queue 是 2）
      方塊的顏色：I #89dceb、O #f9e2af、T #cba6f7、S #a6e3a1、Z #f38ba8、J #89b4fa、L #fab387
      GAME 畫場地（左邊 10 像素）；NEXT 1、NEXT 2 各畫自己那一格（右邊 6 像素、4 像素高）；各自置中在自己的 panel 裡
      窄寬（42–59 欄，只畫有 focus 的 panel）時 GAME 畫整張圖，場地右邊隔一個像素是兩格；Tab 到 NEXT 1、NEXT 2 時各畫自己那一格
      GAME 裡放得下 40 欄、40 列，右邊那一欄放得下 24 欄、終端機的高放得下右邊那一欄時，GAME 與兩個 NEXT 一起把一個像素畫成 2×2，NEXT 的高跟著變兩倍；不然都不放大
      還沒玩過時畫空的場地與空的兩格
      顏色用 tgo 的 Fg 上色；失焦或被 popup 蓋住時由 tgo 淡化；玩的時候（Play 模式裡）NEXT 1、NEXT 2、INFO 標成串流內容（tgo Panel.Stream），失焦也不淡化，
      暫停、結束、還沒玩時拿掉
    test: [TestPictureIsLockus, TestTetruScreen, TestNarrowShowsTheFocusedPanelOnly, TestPictureGrowsTwiceOnALargeTerminal, TestNextStaysBrightWhilePlaying, TestPopupsOverTheGameAtEveryWidth]
  - id: 3
    spec: 1
    implementation: |
      遊戲在 internal/game，不碰終端機：
      七種方塊（locku 的 art 與轉法），七個一袋、袋裡打亂；新方塊的最上面一列在場地第一列、左右置中（3 格寬的偏左半格）；放不進去就結束
      每一格往下的時間照關卡：1000、800、650、520、420、330、260、200、150、100 ms；每消 10 行升一關，到第 10 關為止
      碰到底後 500 ms 固定；這段時間裡移動、旋轉成功就重算，最多 15 次
      旋轉在方塊自己的框裡轉；轉不過去依序試左 1、右 1、上 1，長條再試左 2、右 2
      分數：一次消 1–4 行 100、300、500、800 乘當時的關卡；往下一格 1 分，落到底每一格 2 分
      固定時有一格在場地上方就結束
      tgo App.Tick 每 40 ms 一格推進遊戲（README 的計時器）
    test: [TestPiecesComeSevenToABag, TestSameSeedSameGame, TestPieceComesInAtTheTopInTheMiddle, TestMoveStopsAtTheWalls, TestRotateTurnsAndComesBack, TestRotateKicksOffTheWall, TestDownScoresARow, TestDropSetsThePieceAndScoresTwoARow, TestGravityAtTheLevelsSpeed, TestLockWaitsAndMovingRestartsIt, TestLockResetsRunOut, TestClearScoresAtTheLevelAndGoesUp, TestTheSpeedStopsAtTheLastLevel, TestTheStackAtTheTopEnds, TestEndStopsThePiece, TestTheGameFalls]
  - id: 4
    spec: 3
    implementation: |
      開始或繼續一局時，GAME 進入 tgo 的模式 Play（tgo Panel.EnterMode）：tgo 把外框換成模式色、上框右邊畫 ┫Play┣
      Play 的鍵（tgo ModeKey）照 Settings 的鍵（task 13），預設：h、← 左一格；l、→ 右一格；j、↓ 往下一格；e 左旋（逆時針）；i 右旋（順時針）；
      Enter 落到底並固定；←、→、↓ 一直跟著左、右、往下；k、↑ 沒有登記，不作用（TODO(tdp #4)，spec 的 remark）
      footer 由 tgo 寫：Space:menu ?:help e:rotate left i:rotate right Esc:pause；左右、往下、落到底標成移動鍵，不進 footer，在 ? 與 Space menu
      Play 裡 GAME 的下框不寫 hint（Enter 的 hint 拿掉；panel 上沒有按得動的鍵）
      Enter 在 GAME 上（Play 外）：沒有一局在暫停時開新的一局（task 6），有就繼續（task 5）；hint Enter:play，暫停時 Enter:resume
    test: [TestPlay, TestSpaceMenuRotates, TestTheGameFalls, TestSettingsSetAKey]
  - id: 5
    spec: 3
    implementation: |
      Play 裡按 Space：tgo 開 Play 的 Space menu，標題 [1] GAME：ITEM OPERATION 的 Rotat[e] left（the falling piece, counterclockwise）、
      Rotate r[i]ght（the falling piece, clockwise），選了就等於按那個鍵、回到 Play；PLAY MODE 的 h（move left）、l（move right）、j（down a row）、
      Enter（drop to the bottom）只顯示；[Esc] Pause；寫的都是 Settings 裡現在的鍵
      遊戲每 40 ms 一格，有任何 popup 開著（Space menu、?、confirm）或終端機比 42×30 小時不往前走，popup 關掉就接著走；有沒有 popup 是讀
      tgo 的內部狀態（TODO(tgo #3)，spec 的 remark）
      Esc 離開 Play（tgo Mode.OnExit）：遊戲停著，場地中間畫兩條 Lavender 的直槓；GAME 的 hint 是 Enter:resume；Space menu 是一般的：
      PANEL OPERATION 的 [Enter] Resume（this game, where it was）、[n]ew game、[x] End game，與 Global operation；Enter 回到 Play
      Tab、數字鍵在 Play 裡暫停（tgo Mode.Pause），tgo 跳 Info toast：Press [Esc] to leave Play first
      Settings 的 Pause 一列寫 Space、停用：Enter 不開 select
    test: [TestTheGameStopsUnderAPopup, TestEscPausesEnterResumes, TestTabInPlaySaysToPauseFirst, TestSpaceMenuRotates, TestPauseIsAlwaysSpace]
  - id: 6
    spec: 4
    implementation: |
      GAME 上按 Enter（沒有暫停中的一局時）直接開一局、進 Play，不問名字
      一局有分數時，結束的時候開 tgo 的 text input 問誰玩的：Prompt 是 12,340 points: who played?，建議值（tgo TextInput.Suggest）ANON，
      hint 有 Tab:edit Backspace:clear；最多 16 個字（tgo TextInput.MaxLen）；Enter 用打的名字（去掉前後空白），沒打、清空了都是 ANON
      堆到頂：灰幕落完、END 出來時才開，標題 GAME OVER、Enter:keep；Esc 也記成 ANON（tgo TextInput.OnCancel）；
      灰幕落下到記下之前，GAME 的 Enter 與 [n]ew game 停用（tgo Action.Disabled），Enter:play 的 hint 拿掉，記下之後回來
      [x] End game、[n]ew game、離開流程：見 task 10
      0 分的局不問、不記
    test: [TestNameIsAskedAsTheGameEnds, TestNameTypedIsKept, TestEscOnTheNameKeepsAnon, TestNameWithTrickyCharacters, TestNoPointsNotKept]
  - id: 7
    spec: 4
    implementation: |
      分數存在 TETRU__DATA 或 ~/.tetru 底下的 scores.yaml：scores 底下一筆一個 {time, name, score}，time 是 RFC 3339、到秒，照記下的順序；
      每次整個檔重寫（先寫暫存檔再改名），目錄 0755、檔 0644
      一局結束、問了誰玩的之後記一筆（task 6、10），一局只記一次；main 在 tgo App.Run 結束後（連按兩次 Ctrl-C、關掉終端機），
      還沒記的那一局記成 ANON；0 分的不記
      關掉終端機：main 攔下 SIGHUP、轉成 SIGTERM 送給自己，Run 結束後照樣記（TODO(tgo #4)，spec 的 remark）
      記下時 App Log 記一筆 Success：Kept 12,340 points for vulcan；寫不進去開 error popup：Can't keep the score，檔案路徑與原因
      啟動時 scores.yaml 讀不了：tgo App.MoveAside 問要不要移成 scores.yaml.bak 重新開始；Enter 移開、從空的排行開始，Esc 離開
    test: [TestPathIsInTheDataDirectory, TestSaveThenLoad, TestLoadBroken, TestTopOutKeepsTheScore, TestNoPointsNotKept, TestFinishKeepsTheGameGoing, TestQuitWithAGameAsksAndKeeps, TestBrokenScoresAskToMoveAside]
  - id: 8
    spec: 3
    implementation: |
      Rank 畫面只有 [1] RANK，tgo List：NAME（可截短，最少 6 格）、SCORE（數字靠右，每三位一個逗號）、TIME（2006-01-02 15:04，本地時間，放不下第一個拿掉）
      footer 由 tgo 寫只有一個 panel 的那一種：Space:menu ?:help !:log q:quit
      順序：分數高的在前，同分時間早的在前；不能排序、不能篩選
      記下一筆後 cursor 移到那一筆（tgo List.Select），畫面與 focus 不換
      空的時候：No scores yet / Press [T] to play
      沒有 Enter 與其他動作；j|k、gg|G 由 tgo 移動
    test: [TestScoresBestFirst, TestTopOutKeepsTheScore, TestScreensSwitchOnTRS]
  - id: 9
    spec: 5
    implementation: |
      消行：滿的那幾行先畫成 #ffffff 280 ms，再從場地中間往兩端一格一格變回底色，400 ms 消完，上面的掉下來，下一個方塊進來
      結束：方塊與那幾行由上往下一列像素一列像素變成框的灰，5 秒蓋滿整張圖（場地與兩格）；之後在場地正中間寫 END（locku 的小號像素字，
      E 窄一個像素，整個字 10 像素寬，#f38ba8），一直留著；堆到頂結束的，這時才問誰玩的（task 6）
      兩段動畫都由 tgo App.Tick 每 40 ms 推一格；灰幕不管有沒有 popup 都照走
    test: [TestLineClearFlashesThenGoes, TestTheWipeGoesFromTheMiddleOut, TestTopOutKeepsTheScore, TestTheStackAtTheTopEnds]
  - id: 10
    spec: 4
    implementation: |
      GAME 的 panel operation（Play 外的 Space menu 與熱鍵）：
      [n]ew game（start over from level 1）：有一局有分數時先開 task 6 的 text input，標題 NEW GAME、Enter:start；Enter 記下那一局，接著開新的一局、進 Play；
      Esc 回到遊戲；0 分或沒有一局時直接開新的一局
      [x] End game（keep this score and stop）：有一局有分數時先開同樣的 text input，標題 END GAME、Enter:end；Enter 記下、結束、灰幕開始，
      灰幕落完不再問；Esc 回到遊戲；0 分時直接結束；沒有一局時停用
      離開流程（tgo App.QuitFlow）：有一局有分數時開同樣的 text input，標題 QUIT、Enter:quit；Enter 記下分數，等 popup 收完再離開
      （TODO(tgo #5)，spec 的 remark）；Esc 留下；0 分或沒有一局時直接離開；離開流程中再按一次 Ctrl-C 由 tgo 立刻離開，那一局記成 ANON
    test: [TestEndGameAsksAndKeeps, TestNewGameAsksWhoPlayed, TestQuitWithAGameAsksAndKeeps, TestQuitWithNoGameLeaves, TestNoPointsNotKept]
  - id: 11
    spec: 1
    implementation: |
      docs/icon.svg：U 框照 tdp principle/icon.svg（#205090），金色（#f2b753）的字在框裡上排 T、E，下排 T、R，一個字 5×7 格；註解依序 U、T、E、T、R
      internal/ui/icon.svg 是它的副本，embed 給 tgo 的 splash（tgo NewSplash：tetru、internal/version 的 Display()、A falling-block game for the terminal）
      命令列：tetru version、-v、--version 印 Display()；tetru help、-h、--help 印用法（含分數的位置）；其他字印 unknown command 與用法，exit 2
    test: [TestSplashIsTheIcon, TestVersionAndHelp, TestFirstLaunch]
  - id: 12
    spec: 1
    implementation: |
      repo 照 harness project.3；family.mk、release.yml、.goreleaser.yaml、install.sh、uninstall.sh、internal/version/version.go、.gitignore 照 harness 範本，
      只改表上允許的地方（goreleaser 的 description、caveats 寫分數的位置）
      README.md、README-zh_TW.md 照 tdp E7 的 12 段；demo gif 在 docs/demo.gif，VHS tape 在 .local/demos/demo.tape
      CHANGELOG.md 開頭照 harness project.6，改動寫在 Unreleased
    test:
      - check: repo
  - id: 13
    spec: 3
    implementation: |
      Settings 畫面只有 [1] KEYS，tgo Values（一列一個值）：表頭 ACTION、KEY；MOVE LEFT h、MOVE RIGHT l、DOWN A ROW j、ROTATE LEFT e、ROTATE RIGHT i、
      DROP Enter，最後 PAUSE Space（tgo Field.Disabled）；每一列有說明（tgo Field.Desc，? 的「每一列」）；hint Enter:edit
      Enter 在一列上開 tgo Select：標題 KEY: Rotate left，選項是這個動作能用、沒有別的動作在用的鍵，現在的鍵選著（TODO(tdp #5)，spec 的 remark）：
      小寫字母，不含 q 與 j k u d g h l；左移、右移、往下另外有自己的 h、l、j；落到底另外有 Enter
      Enter 確定時（tgo Select.Commit）寫進設定檔，寫不進去 popup 不關、tgo 開 error popup，鍵不變；寫進去之後 Play 的鍵、footer、Space menu、
      ? 與 INFO 跟著換，App Log 記一筆 Success：Rotate left is now a
      設定檔：TETRU__CONFIG，不然 $XDG_CONFIG_HOME/tetru，不然 ~/.config/tetru 底下的 config.yaml；keys 底下 move_left、move_right、down、
      rotate_left、rotate_right、drop；沒寫的照預設；寫回時檔裡其他的 key 照留；先寫暫存檔再改名，目錄 0755、檔 0644
      啟動時設定檔讀不了（YAML 錯、鍵不能用、兩個動作同一個鍵）：tgo App.MoveAside 問要不要移成 config.yaml.bak，Enter 移開、用預設的鍵，
      Esc 離開；排行的檔也讀不了時接著問它
    test: [TestDefaultIsTheUsersKeys, TestChoicesKeepTdpsKeys, TestFreeLeavesOutTheOthersKeys, TestPathIsInTheConfigDirectory, TestSaveThenLoadKeepsOtherKeys, TestLoadBadKeys, TestSettingsSetAKey, TestSettingsThatCantBeKept, TestBrokenSettingsAskToMoveAside, TestPauseIsAlwaysSpace]
  - id: 14
    spec: 5
    implementation: |
      [4] INFO 的 body 自己畫（tgo Body）：從上面一列一列寫，離框一格
      上面一段：Level: 1 / Lines: 0 / Score: 12,340 一行一個，label Overlay0、值 Lavender；沒在玩時是上一局的值，還沒玩過是 1、0、0
      一條 ╌ 的虛線（Overlay0），寬到離框一格
      下面一段：鍵一欄 5 格（Blue），空兩格，說明：h move left、l move right、j down a row、e rotate left、i rotate right、Enter drop（都照 Settings 現在的鍵）、
      Space pause, menu、Esc pause
      沒有 cursor、沒有鍵；玩的時候是串流內容（task 2），其他時候失焦由 tgo 淡化
    test: [TestStatsInInfo, TestInfoShowsTheKeys, TestSettingsSetAKey, TestNextStaysBrightWhilePlaying]
