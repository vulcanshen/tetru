tasks:
  - id: 1
    spec: 1
    implementation: |
      一個畫面（tgo Screen）兩個 panel：左邊 [1] SCORES（task 8）、右邊 [2] GAME（tgo Panel，自己畫的 body，task 2）；tgo Screen.Layout 放成左右，
      GAME 的寬度是場地那張圖的寬（60 欄時 42 欄：圖 38 欄、panel 的框與左右各一格留白），SCORES 拿剩下的（60 欄時 18 欄）
      啟動時（tgo App.Start）用 tgo App.Focus 把 focus 放到 [2] GAME
      最低尺寸 42×26（tgo App.MinWidth、MinHeight）；比它小時 tgo 只畫名稱、needs a terminal of at least 42×26、Press [Ctrl-C] twice to quit
      窄寬的門檻 60（tgo Screen.NarrowBelow）：42–59 欄只畫有 focus 的 panel，玩的時候 focus 在 GAME，排行就收掉；Tab 換成只畫 SCORES
      statusbar（tgo App.Status）：Level: 1   Lines: 0      Score: 0，label Overlay0、值 Lavender；Level 補到 2 格、Lines 補到 5 格、Score 在最後不補，
      分數每三位一個逗號（12,340）；沒在玩時是上一局的值，還沒玩過是 1、0、0
      tdptest 在每一格畫面量每一列等於終端機寬度（tdp L4）；版面的測試在 icon 與 powerline 符號 1/1、2/1、2/2 格下各跑一次（tdp E5）
    test: [TestLayoutScoresLeftGameRight, TestNarrowShowsTheFocusedPanelOnly, TestLeastSizeIsTheGameAlone, TestPictureGrowsTwiceOnALargeTerminal, TestStatusbar, TestFirstLaunch]
  - id: 2
    spec: 1
    implementation: |
      GAME 的 body 自己畫（tgo Body）：一張 19×22 像素的圖，一個像素是 nf-fa-square（U+F0C8），icon 佔一格時後面補一個空白，所以一個像素 2 欄 × 1 列
      圖：場地 10×20，外框一個像素寬、#7f849c；框裡空的地方也畫像素，#313244（locku 的底）；右邊一欄 4 個框，框裡 6×4 像素，跟場地共用外框，
      最後一個框下面到底都是框的灰；每個框置中畫一個接下來的方塊，一個方塊一個像素，第一個框是下一個
      方塊的顏色：I #89dceb、O #f9e2af、T #cba6f7、S #a6e3a1、Z #f38ba8、J #89b4fa、L #fab387
      圖置中在 GAME 裡；GAME 放得下兩倍（76 欄 × 44 列）、而且 SCORES 還有 18 欄時，一個像素畫成 2×2
      還沒玩過時畫空的場地與空的框
      顏色用 tgo 的 Fg 上色；GAME 失焦或被 popup 蓋住時由 tgo 淡化
    test: [TestPictureIsLockus, TestPictureGrowsTwiceOnALargeTerminal, TestPopupsOverTheGameAtEveryWidth]
  - id: 3
    spec: 1
    implementation: |
      遊戲在 internal/game，不碰終端機：
      七種方塊（locku 的 art 與轉法），七個一袋、袋裡打亂；新方塊的最上面一列在場地第一列、左右置中（3 格寬的偏左半格）；放不進去就結束
      每一格往下的時間照關卡：1000、800、650、520、420、330、260、200、150、100 ms；每消 10 行升一關，到第 10 關為止
      碰到底後 500 ms 固定；這段時間裡移動、旋轉成功就重算，最多 15 次
      旋轉在方塊自己的框裡轉；轉不過去依序試左 1、右 1、上 1，長條再試左 2、右 2
      分數：一次消 1–4 行 100、300、500、800 乘當時的關卡；往下一格 1 分，落到底每一格 2 分
      固定時有一格在場地上方就結束
      tgo App.Tick 每 40 ms 一格推進遊戲（README 的計時器）
    test: [TestPiecesComeSevenToABag, TestSameSeedSameGame, TestPieceComesInAtTheTopInTheMiddle, TestMoveStopsAtTheWalls, TestRotateTurnsAndComesBack, TestRotateKicksOffTheWall, TestDownScoresARow, TestDropSetsThePieceAndScoresTwoARow, TestGravityAtTheLevelsSpeed, TestLockWaitsAndMovingRestartsIt, TestLockResetsRunOut, TestClearScoresAtTheLevelAndGoesUp, TestTheSpeedStopsAtTheLastLevel, TestTheStackAtTheTopEnds, TestEndStopsThePiece, TestTheGameFalls]
  - id: 4
    spec: 1
    implementation: |
      開始或繼續一局時，GAME 進入 tgo 的模式 Play（tgo Panel.EnterMode）：tgo 把外框換成模式色、上框右邊畫 ┫Play┣
      Play 的鍵（tgo ModeKey）：h|l、←|→ 左右一格；j、↓ 往下一格；d、PgDn 落到底並固定；e 左旋（逆時針）、r 右旋（順時針）；k、↑ 沒有登記，不作用
      footer 由 tgo 寫：Space:menu ?:help e:rotate left r:rotate right Esc:pause；h|l、j、d 標成移動鍵，不進 footer，在 ? 與 Space menu
      Play 裡 GAME 的下框不寫 hint（Enter 的 hint 拿掉；panel 上沒有按得動的鍵）
      Enter 在 GAME 上（Play 外）：沒有一局在暫停時開新的一局（task 6），有就繼續（task 5）；hint Enter:play，暫停時 Enter:resume
    test: [TestPlay, TestSpaceMenuRotates, TestTheGameFalls]
  - id: 5
    spec: 1
    implementation: |
      Play 裡按 Space：tgo 開 Play 的 Space menu，標題 [2] GAME：ITEM OPERATION 的 Rotat[e] left（the falling piece, counterclockwise）、
      [r]otate right（the falling piece, clockwise），選了就等於按那個鍵、回到 Play；PLAY MODE 的 h|l（move left, right）、j（down a row）、
      d（drop to the bottom）只顯示；[Esc] Pause
      遊戲每 40 ms 一格，有任何 popup 開著（Space menu、?、confirm）或終端機比 42×26 小時不往前走，popup 關掉就接著走；有沒有 popup 是讀
      tgo 的內部狀態（TODO(tgo)，spec 的 remark）
      Esc 離開 Play（tgo Mode.OnExit）：遊戲停著，場地中間畫兩條 Lavender 的直槓；GAME 的 hint 是 Enter:resume；Space menu 是一般的：
      PANEL OPERATION 的 [Enter] Resume（this game, where it was）、[n]ew game、[x] End game，與 Global operation；Enter 回到 Play
      Tab、數字鍵在 Play 裡暫停（tgo Mode.Pause），tgo 跳 Info toast：Press [Esc] to leave Play first
    test: [TestTheGameStopsUnderAPopup, TestEscPausesEnterResumes, TestTabInPlaySaysToPauseFirst, TestSpaceMenuRotates]
  - id: 6
    spec: 1
    implementation: |
      開新的一局前開 tgo 的 text input：標題 NAME，Who is playing?，Enter:play Esc:cancel；建議值（tgo TextInput.Suggest）是排行裡最後記下的那一筆的名字，
      有建議值時 hint 加 Tab:edit Backspace:clear，什麼都沒碰按 Enter 就用它
      最多 16 個字（tgo TextInput.MaxLen）；去掉前後空白後是空的，錯誤列寫 Type a name，不開始；Esc 不開始
      名字確定後開一局、進 Play
    test: [TestNameIsAskedFirstTheLastOffered, TestEscOnTheNameStartsNothing, TestNameWithTrickyCharacters]
  - id: 7
    spec: 1
    implementation: |
      分數存在 TETRU__DATA 或 ~/.tetru 底下的 scores.yaml：scores 底下一筆一個 {time, name, score}，time 是 RFC 3339、到秒，照記下的順序；
      每次整個檔重寫（先寫暫存檔再改名），目錄 0755、檔 0644
      一局結束時記一筆，一局只記一次：堆到頂、[x] End game、[n]ew game 結束還在玩的那一局、離開流程裡 Quit tetru? 按 Enter、
      main 在 tgo App.Run 結束後（連按兩次 Ctrl-C、關掉終端機）；0 分的不記
      關掉終端機：main 攔下 SIGHUP、轉成 SIGTERM 送給自己，Run 結束後照樣記（TODO(tgo)，spec 的 remark）
      記下時 App Log 記一筆 Success：Kept 12,340 points for vulcan；寫不進去開 error popup：Can't keep the score，檔案路徑與原因
      啟動時 scores.yaml 讀不了：tgo App.MoveAside 問要不要移成 scores.yaml.bak 重新開始；Enter 移開、從空的排行開始，Esc 離開
    test: [TestPathIsInTheDataDirectory, TestSaveThenLoad, TestLoadBroken, TestTopOutKeepsTheScore, TestNoPointsNotKept, TestFinishKeepsTheGameGoing, TestQuitWithAGameAsksAndKeeps, TestBrokenScoresAskToMoveAside]
  - id: 8
    spec: 1
    implementation: |
      [1] SCORES 是 tgo List：NAME（可截短，最少 6 格）、SCORE（數字靠右，每三位一個逗號）、TIME（2006-01-02 15:04，本地時間，放不下第一個拿掉）
      順序：分數高的在前，同分時間早的在前；不能排序、不能篩選
      記下一筆後 cursor 移到那一筆（tgo List.Select），focus 不換
      空的時候：No scores yet / Press [Enter] on [2] GAME to play
      沒有 Enter 與其他動作；j|k、gg|G 由 tgo 移動
    test: [TestScoresBestFirst, TestTopOutKeepsTheScore]
  - id: 9
    spec: 1
    implementation: |
      消行：滿的那幾行先畫成 #ffffff 280 ms，再從場地中間往兩端一格一格變回底色，400 ms 消完，上面的掉下來，下一個方塊進來
      結束：方塊與那幾行由上往下一列像素一列像素變成框的灰，5 秒蓋滿整張圖；之後在整張圖正中間寫 END（locku 的小號像素字，#f38ba8），一直留著
      兩段動畫都由 tgo App.Tick 每 40 ms 推一格；灰幕不管有沒有 popup 都照走
    test: [TestLineClearFlashesThenGoes, TestTheWipeGoesFromTheMiddleOut, TestTopOutKeepsTheScore, TestTheStackAtTheTopEnds]
  - id: 10
    spec: 1
    implementation: |
      GAME 的 panel operation（Play 外的 Space menu 與熱鍵）：
      [n]ew game（start over from level 1）：有一局沒結束時先開 confirm NEW GAME：This game ends with 12,340 points, kept for vulcan. /
      Start a new game?，Enter:start Esc:cancel；Enter 結束那一局並記下（task 7），接著問名字（task 6）；沒有一局時直接問名字
      [x] End game（keep this score and stop）：有一局沒結束時先開 confirm END GAME，同樣說出會記下什麼，End this game?，Enter:end；
      Enter 結束、記下、灰幕開始；沒有一局時停用
      0 分時 confirm 寫 This game has no points yet: nothing is kept.
      離開流程（tgo App.QuitFlow）：有一局沒結束時開 confirm QUIT：說出會記下什麼，Quit tetru?，Enter:quit Esc:cancel；Enter 記下分數，
      等 confirm 收完再離開（TODO(tgo)，spec 的 remark）；沒有一局時直接離開；離開流程中再按一次 Ctrl-C 由 tgo 立刻離開
    test: [TestEndGameAsksAndKeeps, TestNewGameAsksThenAsksTheName, TestQuitWithAGameAsksAndKeeps, TestQuitWithNoGameLeaves, TestNoPointsNotKept]
  - id: 11
    spec: 1
    implementation: |
      docs/icon.svg：U 框照 tdp principle/icon.svg（#205090），金色（#f2b753）的字在框裡上排 T、E，下排 T、R，一個字 5×7 格；註解依序 U、T、E、T、R
      internal/ui/icon.svg 是它的副本，embed 給 tgo 的 splash（tgo NewSplash：tetru、internal/version 的 Display()、A falling-block game for the terminal）
      命令列：tetru version、-v、--version 印 Display()；tetru help、-h、--help 印用法（含分數的位置）；其他字印 unknown command 與用法，exit 2
    test: [TestSplashIsTheIcon, TestVersionAndHelp, TestFirstLaunch]
  - id: 12
    spec: 1
    implementation: |
      repo 照 harness project.3；family.mk、release.yml、.goreleaser.yaml、install.sh、uninstall.sh、internal/version/version.go、.gitignore 照 harness 範本，
      只改表上允許的地方（goreleaser 的 description、caveats 寫分數的位置）
      README.md、README-zh_TW.md 照 tdp E7 的 12 段；demo gif 在 docs/demo.gif，VHS tape 在 .local/demos/demo.tape
      CHANGELOG.md 開頭照 harness project.6，改動寫在 Unreleased
    test:
      - check: repo
