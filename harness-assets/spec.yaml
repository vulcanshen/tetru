  - id: 16
    spec: 12
    request: 'Space menu 的 save 把當前分數和 panel 1 已經落地的格子位置存起來；重新啟動後接著玩，地上的格子直接是白色，不用分色（使用者 2026-11-11）。save 是存檔並離開：這一局先不記排行，下次開 tetru 接著玩，讀回來就刪掉存檔（使用者選的）'
    tdp: [tdp E3, tdp E2, tdp P5, tdp F6, tdp K9, tdp note, tdp note.7, tdp M2, tdp M6, tdp menu.4]
    remark:
