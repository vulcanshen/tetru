  - id: 9
    spec: 12
    request: '湊齊一排時，滿排的列先變白色，再從下到上依序向左滑出 panel 1（GAME），然後整個場地往下降、上方補上空的格子；期間不能操作，正在玩的方塊不跟著降（使用者 2026-11-11）。結束時照 locku 由上往下變灰。結束用 popup 說，不在遊戲裡寫 END（使用者 2026-11-11：那是 locku 的限制，tetru 是獨立的 app）'
    tdp: [tdp P5, tdp F1, tdp F6, tdp confirm]
    remark:
      - '消行（使用者 2026-11-11，取代第一版照 locku 的閃白、從中間往兩端消失）：滿的那幾行先整行變白 200 ms（使用者 2026-11-11：不只滑走，還要變白色），再白色的從最下面那一行開始，一行一行往左滑，滑過場地左邊的空白、滑出 GAME 的框才不見；一行滑 360 ms，先慢後快，下一行在前一行開始滑 120 ms 後跟著滑（依序，但不用等前一行滑完），滑走的地方留下空的格子。全部滑出去之後，上面的整片往下降，一次一列像素、40 ms 一列，降到補滿空出來的行，最上面補空的格子'
      - '這段期間不能操作（Play 模式的鍵按了沒反應，不另外說），也不往下掉：下一個方塊在滿行的那一刻就出現在最上面，停在那裡，不跟著場地往下降（使用者 2026-11-11：畫面中正在操作的方塊不跟著下降）；降完才開始掉、才能操作。下一個方塊放不進去（堆到頂）在降完時才判，消掉的行可能讓出位置'
      - '分數、行數、關卡在滿行的那一刻就加：INFO 馬上跟著變，動畫中途離開，這幾行也照樣算'
      - '結束時方塊由上往下變灰 5 秒，照 locku（場地與 NEXT 一起），灰的留在畫面上，場地上不寫字'
      - '堆到頂時灰幕落完才用 popup 說結束：有分數的局是問誰玩的 text input，標題 GAME OVER（task 6）；0 分的局開 confirm（tdp F1、F6）：內容 Game over: no points, so nothing is kept.，問句 Play again?，標題照 tdp confirm.2 寫 Enter 做的動作 PLAY，Enter:play 開下一局，Esc:cancel 回到 GAME（hint Enter:play）'
      - '[x] End game、[n]ew game 結束的，灰幕落完不再開 popup：結束是玩家自己選的，問名字時已經說了（task 10）'
      - '動畫用 tgo App.Tick（README 的計時器），測試推得動'
