id: 2
from: v1.2.2
to: v1.2.2
tasks:
  - id: 1
    spec: 2
    request: '一個直的空間玩遊戲，右邊是接下來的方塊的框；排行放在左邊；終端機窄的時候，排行那一欄優先收掉；分三欄，接下來的方塊放到獨立的 panel，排行與遊戲的比例在寬或窄的終端機上都不能一邊倒'
    tdp: [tdp terms.2, tdp terms.3, tdp screen.1, tdp screen.4, tdp screen.5, tdp screen.7, tdp L1, tdp L2, tdp L3, tdp L4, tdp E5, tdp panel.1, tdp panel.4, tdp K1, tdp K2]
    remark:
      - |
        60×32 的版面（使用者 2026-11-11 提的三欄）：
         Level: 3   Lines: 25     Score: 12,340
        ┌[1] SCORES────┐┏[2] GAME━━━━━━━━━━━━━━━━┓┌[3] NEXT────────┐
        │ NAME   SCORE │┃▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒┃│▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒│
        │ vul…  52,300 │┃▒▒                    ▒▒┃│▒▒  ████████  ▒▒│
        │ amy   31,020 │┃▒▒        ██          ▒▒┃│▒▒            ▒▒│
        │              │┃▒▒        ████        ▒▒┃│▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒│
        │              │┃▒▒        ██          ▒▒┃│▒▒    ████    ▒▒│
        │              │┃      ⋮ 20 rows ⋮       ┃│▒▒    ████    ▒▒│
        │              │┃▒▒████          ██████▒▒┃│    ⋮ 4 boxes   │
        │              │┃▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒┃│▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒│
        └──────────────┘┗━ Enter:play ━━━━━━━━━━━┛└────────────────┘
         Space:menu ?:help !:log Tab|1–3:panels q:quit
      - '三個 panel：左邊 [1] SCORES、中間 [2] GAME（場地）、右邊 [3] NEXT（接下來的方塊）。panel 怎麼拆，app 可以自行決定（tdp L1）；遊戲的右邊留給接下來的方塊，排行在遊戲中不是最重要的，放左邊；接下來的方塊自己一個 panel（使用者 2026-11-11）。編號照由左到右'
      - '三個 panel 一樣寬，但不小於各自的最小寬度：GAME 26 欄（場地 24 欄與 panel 的框）、NEXT 18 欄（框 16 欄與 panel 的框）、SCORES 16 欄（名字與分數）；比平分寬的拿最小寬度，其他的再平分剩下的。60 欄時 16｜26｜18，77 欄時 26｜26｜25，150 欄時各 50，GAME 在畫面正中間。第一版 GAME 只拿場地的寬、SCORES 拿剩下的，寬的終端機上排行佔了七成（使用者 2026-11-11：比例太糟糕，寬窄都一樣）'
      - '60 欄時 SCORES 只有 16 欄：名字截到 3 個字加 …（tdp panel.5 的截短）；powerline 符號佔兩格時膠囊截成 [1] SCOR…（tdp panel.4）'
      - '啟動時 focus 在 [2] GAME：打開 app 就是要玩'
      - '最低尺寸 42×26（tdp L1：可以調低）：剛好放得下 GAME 自己（場地與框 22 列、panel 的框 2 列、statusbar 與 footer 各 1 列）。窄寬的門檻 60（tdp screen.5 的上限；三個 panel 的最小寬度加起來剛好 60）：42–59 欄只畫有 focus 的 panel、佔滿寬度。tdp 的窄寬是「只畫 focus 的那一個」，沒有「指定先收哪一個」；玩的時候 focus 在 GAME，排行就收掉（使用者要的「排行優先收掉」），NEXT 也一起收掉，所以這時 GAME 自己把接下來的方塊畫在場地右邊，跟 locku 一樣（task 2）'
      - 'statusbar（tdp screen.4）：Level、Lines、Score 三組，label Overlay0、值 Lavender（現在玩到哪）；Level、Lines 補成固定寬，Score 在最後不補（tdp L2）。沒有在玩時寫上一局最後的值，還沒玩過寫第 1 關、0 行、0 分'
  - id: 2
    spec: 2
    request: '顯示方式沿用 locku 的 tetromino：一樣的方塊、一樣的顏色、一樣的灰框，右邊一欄框放接下來的方塊；接下來的方塊放到獨立的 panel'
    tdp: [tdp P5, tdp P4, tdp F1, tdp T2, tdp F8, tdp screen.5]
    remark:
      - '照 locku 的 tetromino 螢幕保護（internal/saver/tetromino.go）：一個像素 2 欄 × 1 列；一格方塊一個像素；場地 10×20，外框一個像素寬的灰（catppuccin overlay1 #7f849c）；右邊一欄 4 個框，框裡 6×4 像素、一個方塊一個像素、置中'
      - '分三欄之後（使用者 2026-11-11）：GAME 畫場地與它的框，NEXT 畫那一欄框（左邊的框線就是場地右邊的那一條，兩個 panel 裡各畫一次）；兩張圖一樣高、都垂直置中，橫著看是對齊的。窄寬時只畫 GAME（tdp screen.5），這時 GAME 照 locku 把那一欄框畫在場地右邊、共用外框，玩的時候照樣看得到接下來的方塊'
      - '方塊的顏色照 locku（catppuccin-mocha）：I sky、O yellow、T mauve、S green、Z red、J blue、L peach。內容本身的顏色是領域的，app 可以自行決定（tdp P5）；不碰介面元素用的意義（tdp P4）'
      - '放大：GAME 與 NEXT 都放得下兩倍時，兩邊一起把一個像素畫成 2×2（4 欄 × 2 列），照 locku 的 fitScene；只放得下一邊時都不放大，兩張圖的像素一樣大'
      - '場地與框是 panel 內容自己畫的，不是 popup（tdp F1）。GAME 失焦時照 tdp T2 跟著淡化（遊戲那時是停的，不是串流內容）。玩的時候 NEXT 是串流內容、不淡化（tdp T2：接下來的方塊一直在換，玩家眼睛在場地上、用餘光看它）；暫停、結束、還沒玩時沒有東西在流，照常淡化'
  - id: 3
    spec: 1
    request: '真的可以玩的落塊消行遊戲；10 關，關卡指的是速度：到第 10 關之後不再加速，一直玩到遊戲結束或玩家離開'
    tdp: [tdp P5]
    remark:
      - '遊戲規則是功能邏輯，app 可以自行決定（tdp P5）'
      - '七種方塊，七個一袋、袋裡順序打亂（照 locku）；新的方塊從場地上方、正中間進來'
      - '每消 10 行升一關；第 1–10 關每往下一格的時間：1000、800、650、520、420、330、260、200、150、100 ms；第 10 關之後不再升、不再加速（使用者 2026-11-11）'
      - '碰到底之後 500 ms 才固定；那段時間裡移動、旋轉成功就重新算，最多重算 15 次，免得一直拖著不落'
      - '旋轉照 locku：方塊在自己的框裡轉。轉不過去時依序試往左 1 格、往右 1 格、往上 1 格，長條再試左右各 2 格'
      - '分數：一次消 1、2、3、4 行是 100、300、500、800 乘上當時的關卡；j 往下每一格 1 分、d 落下每一格 2 分'
      - '新的方塊放不進場地，或固定時有一格還在場地上方，遊戲結束（照 locku）'
      - '名字是 tetru；不用別的遊戲的名稱、商標與音樂'
  - id: 4
    spec: 1
    request: 'h、l 左右移動；e 左旋、r 右旋；d 快速落下'
    tdp: [tdp K11, tdp K12, tdp K3, tdp P5, tdp M5, tdp panel.3, tdp screen.2, tdp menu.4, tdp K6]
    remark:
      - '遊戲進行中是 GAME 的模式 Play（tdp K11：進入之後一部分鍵換成模式自己的意思，Esc 離開）：外框換成模式色、上框右邊 ┫Play┣（tdp panel.3）；只有 Play 的鍵與 core key 作用，亂按的其他鍵不出聲'
      - 'Enter 在 GAME 上是開始一局或繼續（tdp K3：panel 沒有項目時，對整個 panel 做最直觀的動作）'
      - 'h|l、←|→ 左右一格；j、↓ 往下一格：tdp K12 的方向鍵就是方向'
      - 'd、PgDn 落到底並固定：tdp K12 的 d 是往下大步移動、到底停住，落到底就是這個方向；PgDn 照 K12 跟 d 一樣'
      - 'k、↑ 不作用：方塊不能往上。使用者 2026-11-11 原本想拿 k 旋轉；tdp K12 沒有「沒東西可移就可以拿去用」的例外，使用者選了不回報、改用別的鍵'
      - 'e 左旋、r 右旋（使用者 2026-11-11 選的）：領域熱鍵，app 可以自行決定（tdp P5），不佔 core key、不佔移動的字母；e 在 tdp K12 只在一段文字裡移動時保留，GAME 沒有文字游標'
      - 'footer 在 Play 裡照 tdp screen.2：Space:menu ?:help e|r:rotate Esc:pause；移動的鍵在 ? 與 Space menu（tdp K6、menu.4），不佔 footer，窄的時候 Esc:pause 才不會先被捨掉'
  - id: 5
    spec: 1
    request: 'Space 暫停，並打開 Space menu'
    tdp: [tdp K5, tdp K11, tdp K4, tdp menu.4, tdp M2, tdp M7, tdp L1, tdp screen.7]
    remark:
      - 'Play 裡按 Space 開 Play 模式的 Space menu（tdp K11、menu.4）：ITEM OPERATION 是對落下中的方塊的 [e] Rotate left、[r] Rotate right；PLAY MODE 列 h|l、j、d（只顯示）與 [Esc] Pause。menu 開著遊戲就停，Esc 或 Space 關掉就接著玩'
      - '遊戲只在 Play 裡、沒有任何 popup、終端機不比最低尺寸小時才走；toast 不是 popup，不擋'
      - note: 'tgo 沒有公開「現在有沒有 popup 開著」，遊戲停不停只能靠讀 tgo 內部的 popup 疊（TODO(tgo)），測試守住它跟 tgo 的行為一致；等 tgo 給 API 再改'
        issue: 待回報 terminu-go
      - 'Esc 離開 Play＝暫停（tdp K4：Esc 是安全的出口，不會丟掉這一局）：場地中間畫暫停記號，兩條直槓（Lavender）；GAME 的 hint 換成 Enter:resume；Enter 回到 Play。原本想寫 PAUSE 的像素字，五個字 19 像素寬，比場地寬'
      - '暫停時 GAME 的 Space menu 是一般的（tdp M2）：PANEL OPERATION 的 [Enter] Resume、[n]ew game、[x] End game，與 Global operation'
      - 'Tab、數字鍵在 Play 裡暫停（tdp K11），按了 tgo 跳 Info toast：Press [Esc] to leave Play first'
  - id: 6
    spec: 1
    request: '每一筆分數記姓名'
    tdp: [tdp text, tdp input.6, tdp F7, tdp K3, tdp K4]
    remark:
      - '開始新的一局之前開 text input（tdp text）：標題 NAME，Enter:play；建議值是上一筆紀錄的名字（tdp input.6），什麼都沒碰按 Enter 就用它；第一次玩沒有建議值'
      - '在開始前問，不在結束時問：中途離開也要記分數（使用者 2026-11-11），離開的時候沒有機會問'
      - '去掉前後空白後不能空（錯誤列寫 Type a name），最多 16 個字；Esc 不開始（tdp K4）'
  - id: 7
    spec: 1
    request: '分數記在 data 目錄，每一筆記時間、姓名、分數；玩家中途離開也算分數，記離開當下的分數'
    tdp: [tdp E2, tdp E3, tdp P5, tdp F5, tdp note.7]
    remark:
      - '刪了就找不回來的紀錄是資料（tdp E3）：~/.tetru/scores.yaml，TETRU__DATA 覆寫（tdp E2）；檔案格式 app 可以自行決定（tdp P5）'
      - '格式：scores 底下一筆一個 {time, name, score}；time 是 RFC 3339，照記下的順序附在最後'
      - '什麼時候記：堆到頂結束、[x] End game、[n]ew game 結束還在玩的那一局、離開 app 時有一局還沒結束（q、Ctrl-C，連按兩次 Ctrl-C 也一樣，關掉終端機也一樣）'
      - note: 'tgo 的 Run 收到 SIGHUP（關掉終端機）時不會結束，程式直接被殺，Run 之後的收尾跑不到；main 暫時攔下 SIGHUP、轉成 SIGTERM 送給自己（bubbletea 收到 SIGTERM 會正常結束 Run）（TODO(tgo)）'
        issue: 待回報 terminu-go
      - '分數是 0 的那一局不記：一行都沒消、沒用 j 或 d 落下，排行上只會多一列 0'
      - '記下時在 App Log 記一筆（tdp note.7）；寫不進去開 error popup（tdp F5）；讀不了時照 tdp E3 問要不要移開（tgo MoveAside）'
  - id: 8
    spec: 1
    request: '排行放在左邊'
    tdp: [tdp panel.5, tdp screen.8, tdp K3, tdp K12]
    remark:
      - '[1] SCORES 是一般清單（tdp panel.5）：NAME（可截短）、SCORE（數字靠右）、TIME（2006-01-02 15:04），欄放不下先拿掉 TIME'
      - '順序固定：分數高的在前，同分照時間早的在前（tdp panel.5 的「順序要固定」）'
      - '記下一筆之後，SCORES 的 cursor 移到那一筆（tdp K3：新增一項之後 cursor 移到新的那一項）；focus 不換'
      - '沒有紀錄時空狀態：No scores yet / Press [Enter] on [2] GAME to play（tdp screen.8）'
      - 'Enter 在一筆紀錄上沒有動作：紀錄沒有東西可以打開'
  - id: 9
    spec: 2
    request: '消行與結束的樣子照 locku：消的那幾行先閃白，再從中間往兩端消失；結束時由上往下變灰，再寫出紅色的 END'
    tdp: [tdp P5]
    remark:
      - '照 locku 的時間：閃白 280 ms、往兩端消失 400 ms；結束時方塊由上往下變灰 5 秒（場地與 NEXT 的框一起），接著寫出 END（catppuccin red #f38ba8，locku 的小號像素字）留在畫面上'
      - 'END 置中在場地裡：分三欄之後場地自己一個 panel（task 2），locku 的 END 11 像素寬、場地裡面只有 10；E 窄一個像素（2 像素寬），整個字 10 像素剛好放進場地，其他照 locku'
      - '動畫用 tgo App.Tick（README 的計時器），測試推得動'
  - id: 10
    spec: 1
    request: '玩家可以中途結束、重新開始或離開，結束或離開時記下當下的分數'
    tdp: [tdp M2, tdp M3, tdp M5, tdp M6, tdp F6, tdp confirm, tdp K9]
    remark:
      - '[x] End game（save this score and stop）與 [n]ew game（start over from level 1）是 GAME 的 panel operation（tdp M2、M3）；n、x 是領域熱鍵（tdp P5），不佔移動的字母'
      - '有一局還沒結束時兩個都先 confirm（tdp F6：哪些要確認 app 可以自行決定），說出會記下的分數；沒有一局在玩時 [x] End game 停用（tdp M6）'
      - '離開流程（tdp K9）：有一局還沒結束時先 confirm Quit tetru?，說出會記下的分數；沒有就直接離開'
      - note: 'app 自己開的 confirm 在 Enter 時回 tea.Quit，tdptest 會卡在 confirm 收起的動畫（tgo 自己的 Quit confirm 沒有這個問題）；暫時等 confirm 收完（tdp F2 的 288 ms）再離開（TODO(tgo)）'
        issue: 待回報 terminu-go
  - id: 11
    spec: 1
    request: '跟家族其他 app 一樣有 splash、version、help'
    tdp: [tdp S1, tdp S2, tdp S3, tdp S4, tdp S5, tdp E1, tdp E6]
    remark:
      - 'docs/icon.svg：U 框照 tdp principle/icon.svg，金色的字在框裡拼 T、E、T、R（框本身是 U），排法照 demou 的兩排兩個'
      - 'splash 的介紹：A falling-block game for the terminal'
  - id: 12
    spec: 1
    request: '照家族的 repo 與發布方式'
    tdp: [tdp E4, tdp E6, tdp E7, harness project.2, harness project.3, harness project.4, harness project.5, harness project.6]
    remark:
      - 'repo 照 harness project.3；README 兩份照 tdp E7 的 12 段'
