        ┗━ Enter:play ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
        Space:menu ?:help !:log q:quit
      - '三個畫面（tdp terms.2：一組同時顯示的 panel；多畫面用 global operation 切換）：[T]etru 是遊戲、[R]ank 是排行（task 8）、[S]ettings 是按鍵（task 13）。最上面一列是畫面 chip（tdp screen.3），chip 列下面一條全寬的線。T、R、S 是 global 熱鍵（tdp M4：沒有 popup 開著時在 panel 上也能直接按；模式裡不作用，玩的時候要先 Esc），大寫是 Shift，跟家族的多畫面 app（sshu、webu）一樣用大寫字母。第一版的 [G]ame 用不了：G 在 tdp K12 保留給「到最底下」'
      - 'Tetru 畫面只有一個 panel：[1] PLAYGROUND（task 2），佔滿 panel 區；右邊一欄由上而下 NEXT 1、NEXT 2（task 2）、INFO、KEYS（task 14）是 PLAYGROUND 自己畫的框（task 15）。panel 怎麼拆，app 可以自行決定（tdp L1）。啟動時 focus 在 [1] PLAYGROUND：打開 app 就是要玩；只有一個 panel，footer 沒有 Tab|1–N（tdp screen.2）'
      - '寬度：右邊那一欄（框與它右邊離 PLAYGROUND 的框一格）是整個寬度的三分之一，至少放得下 INFO（框 23 欄加一格），場地那一塊拿 PLAYGROUND 裡剩下的：60 欄 34｜24、77 欄 50｜25、150 欄 98｜50。三分之一照 tdp L1 自己舉的 1:2；遊戲在左邊、佔大半，第一版排行在寬的終端機上佔了七成（使用者 2026-11-11：比例太糟糕）'
      - '高度：NEXT 1、NEXT 2 各是一格的高（4 列加框，6 列；放大時 10 列），從 PLAYGROUND 裡第一列開始；INFO 是三行加框，5 列；KEYS 拿剩下的到 PLAYGROUND 裡最後一列'
      - 'Level、Lines、Score 在 INFO 上面那一段，一行一個（使用者 2026-11-11：GAME 裡只放場地；GAME 就是現在的 PLAYGROUND）；不再有 statusbar（tdp screen.4：要不要有，app 可以自行決定；多畫面時它會在 chip 列的右邊，離遊戲很遠）。label Overlay0、值 Lavender（現在玩到哪，同 statusbar）。沒有在玩時寫上一局最後的值，還沒玩過寫第 1 關、0 行、0 分'
      - '遊戲太小、空間要用滿（使用者 2026-11-11，150×32 與 77×32 的終端機）：PLAYGROUND 裡只有場地（Level 等在 INFO）、場地沒有自己的框。一格方塊是 locku 的方塊 icon，一格只能一列高：場地照使用者說的固定 12 格寬、24 格高（2026-11-11：寬高都是固定的數字，加大一點），32 列時 PLAYGROUND 裡 27 列，場地 24 列；PLAYGROUND 裡有 48 列（53 列的終端機）起放大成兩倍。曾經改成實心方塊、一格 1.25 列高填滿 PLAYGROUND，使用者看了要換回原本的方塊 icon（2026-11-11）'
      - '最低尺寸 42×32（tdp L1：可以調低）：寬是 PLAYGROUND 自己（場地與兩格 38 欄、上面一行 Level 等 38 欄、panel 的框與左右各一格）；高是 chip 列與線 2 列、footer 1 列、PLAYGROUND 的框 2 列，加上 PLAYGROUND 裡右邊那一欄：NEXT 1、NEXT 2 各 6 列、INFO 3 列與框、KEYS 8 列與框，共 27 列；窄寬時放得下 Level 那一行、空一行與場地 24 列。三個框還是 panel 時是 42×29，改成 PLAYGROUND 裡的框（task 15）之後多了 PLAYGROUND 的框 2 列，INFO 拆成 INFO 與 KEYS（task 14）又多 1 列。窄寬的門檻 60（tdp screen.5 的上限）：42–59 欄 PLAYGROUND 不畫右邊那一欄，在場地上面寫一行 Level、Lines、Score，場地右邊畫兩個接下來的方塊、沒有框（task 2）'
  - id: 2
    spec: 17
    request: '顯示方式沿用 locku 的 tetromino：一樣的方塊 icon、一樣的顏色；接下來的方塊在 Next 1、Next 2 兩個 panel，每個只放一個，裡面是高 4、寬 6 的格子（使用者 2026-11-11 先要 5×5，再改成 4×6）；場地與 Next 都不要自己的外框'
    tdp: [tdp P5, tdp P4, tdp F1, tdp F8, tdp screen.5]
    remark:
      - '照 locku 的 tetromino 螢幕保護（internal/saver/tetromino.go）：一個像素是 locku 的方塊 icon（nf-fa-square），2 欄 × 1 列；一格方塊一個像素；場地 12×24（task 3），空的地方畫 locku 的底；接下來的方塊一個一格，寬 6、高 4 像素的底（使用者 2026-11-11：4×6，問過是高 4 寬 6）、一個方塊一個像素、置中；放不正中時（三格寬的放在六格裡）偏左'
      - '放大：場地那一塊與右邊那一欄都放得下兩倍時（場地那一塊 48 欄、PLAYGROUND 裡 48 列，框裡 24 欄，PLAYGROUND 裡的高也放得下右邊那一欄），場地與兩格一起把一個像素畫成 2×2（4 欄 × 2 列），照 locku 的 fitScene；NEXT 的框跟著變高'
      - '場地與接下來的方塊都沒有自己的灰框（使用者 2026-11-11：GAME 的 panel 就是遊戲本身，GAME 就是現在的 PLAYGROUND；panel 的框就是它的框）；NEXT 1、NEXT 2 的框是放那一格的框（task 15），格子本身沒有框'
      - 'PLAYGROUND 畫場地與右邊那一欄：NEXT 1、NEXT 2 各一格（6×4 像素），各放一個接下來的方塊（使用者 2026-11-11：每個 Next 只放一個）；場地置中在左邊那一塊，每格置中在自己的框裡。接下來的方塊只看兩個（第一版是四個）'
      - '窄寬時（tdp screen.5 的寬）PLAYGROUND 畫不下右邊那一欄，把兩格畫在場地右邊、隔一個像素，兩格之間也隔一個像素，沒有框；玩的時候照樣看得到接下來的方塊'
      - '方塊的顏色照 locku（catppuccin-mocha）：I sky、O yellow、T mauve、S green、Z red、J blue、L peach。內容本身的顏色是領域的，app 可以自行決定（tdp P5）；不碰介面元素用的意義（tdp P4）'
      - '場地、接下來的方塊與它們的框都是 PLAYGROUND 內容自己畫的，不是 popup（tdp F1）。PLAYGROUND 是畫面上唯一的 panel，一直有 focus，不會失焦淡化；被 popup 蓋住時跟著淡化'
  - id: 3
    spec: 9
    request: '真的可以玩的落塊消行遊戲；10 關，關卡指的是速度：到第 10 關之後不再加速，一直玩到遊戲結束或玩家離開'
    tdp: [tdp P5]
    remark:
      - '遊戲規則是功能邏輯，app 可以自行決定（tdp P5）'
      - '場地 12 格寬、24 格高（使用者 2026-11-11：寬高固定，比標準的 10×20 加大一點；寬高比照樣 1:2）'
      - '七種方塊，七個一袋、袋裡順序打亂（照 locku）；新的方塊從場地上方、正中間進來'
      - '每消 10 行升一關；第 1–10 關每往下一格的時間：1000、800、650、520、420、330、260、200、150、100 ms；第 10 關之後不再升、不再加速（使用者 2026-11-11）'
      - '碰到底之後 500 ms 才固定；那段時間裡移動、旋轉成功就重新算，最多重算 15 次，免得一直拖著不落'
      - '旋轉照 locku：方塊在自己的框裡轉。轉不過去時依序試往左 1 格、往右 1 格、往上 1 格，長條再試左右各 2 格'
      - '分數：一次消 1、2、3、4 行是 100、300、500、800 乘上當時的關卡；往下一格每一格 1 分、落到底每一格 2 分'
      - '新的方塊放不進場地，或固定時有一格還在場地上方，遊戲結束（照 locku）'
      - '名字是 tetru；不用別的遊戲的名稱、商標與音樂'
  - id: 4
    spec: 18
    request: '遊戲的按鍵：h 左、l 右、j 下一格、d 左旋、k 右旋、Enter 快速向下；這是遊戲，要讓使用者好玩，跟 tdp 衝突就請 tdp 調整'
    tdp: [tdp K11, tdp K12, tdp K3, tdp P5, tdp M5, tdp panel.3, tdp screen.2, tdp menu.4, tdp K6]
    remark:
      - '遊戲進行中是 PLAYGROUND 的模式 Gaming（tdp K11：進入之後一部分鍵換成模式自己的意思，Esc 離開）：外框換成模式色、上框右邊 ┫Gaming┣（tdp panel.3）；只有 Gaming 的鍵與 core key 作用，亂按的其他鍵不出聲'
      - 'Gaming 的鍵是使用者在 Settings 設的（task 13），預設照使用者 2026-11-11 說的：h 左、l 右、j 往下一格、d 左旋、k 右旋、Enter 落到底（原本是 k 左旋、i 右旋，使用者玩過之後改的）'
      - 'd 左旋、k 右旋：Gaming 裡方塊不會往上，也沒有半頁可翻，k、d 沒有移動可做，模式可以拿它們做自己的動作（tdp K12，K12-19；tdp #4 回報後 v1.2.3 放行），↑ 跟 k、PgDn 跟 d 做一樣的事；照模式其他的鍵一樣寫在 ? 與 footer（Space menu 不列，task 5）'
      - '方向鍵跟著字母：h|j|k|l 就是 ←|↓|↑|→，u|d 就是 PgUp|PgDn（tdp K12），哪個動作的鍵是這幾個字母，它的方向鍵或 PgUp|PgDn 就做那個動作；預設 ← 左、→ 右、↓ 往下、PgDn 左旋、↑ 右旋。動作設成別的字母時，原本那個字母與它的方向鍵就不作用'
      - 'Enter 在 Gaming 裡是落到底並固定：K11 的表沒有 Enter，照 tdp K3「對 focus 的東西做最直觀的動作」，Gaming 裡 focus 的是落下中的方塊，把它放到底就是最直觀的（跟 Drag mode 的 Enter 放下一樣）。Gaming 外 Enter 在 PLAYGROUND 上是開始一局或繼續（tdp K3：panel 沒有項目時，對整個 panel 做最直觀的動作）'
      - '旋轉是對落下中的方塊做的事，在 footer；移動與落到底是移動，不佔 footer，60 欄時 Esc:pause 才不會被捨掉（footer：Space:menu ?:help d:rotate left k:rotate right Esc:pause）。這些鍵都在 ?（tdp K6），不列在 Space menu（task 5）'
  - id: 5
    spec: 19
    request: 'Space 暫停，並打開 Space menu；Space 不能改；暫停用 popup 顯示，不畫在遊戲裡（那是 locku 的限制，tetru 是獨立的 app）；玩的時候的 Space menu 不用列 h、l、j、k、Enter，連 d、k 都不用，應該是給 restart、save（使用者 2026-11-11）；後來使用者一度說列的確實是這個模式的鍵，再問為什麼 h、l、j、Enter 出現在裡面，選了重新打開 tdp #7（2026-11-11）'
    tdp: [tdp K5, tdp K11, tdp K4, tdp menu.4, tdp M2, tdp M7, tdp L1, tdp screen.7, tdp F1, tdp F6, tdp confirm]
    remark:
      - 'Gaming 裡按 Space 開 Gaming 模式的 Space menu（tdp K11：app 自己的模式，Space menu 列什麼 app 可以自行決定；標題與樣子照 menu.4）：只有 GAMING MODE 的 [r]estart、[s]ave（使用者 2026-11-11：應該是給 restart、save），選了等於按 r、s。玩的鍵不列，都在 ? 與 INFO；[Esc] Pause 那一列也不列（K11：留不留 app 決定；使用者要的只有這兩列，Esc:pause 在 footer）。menu 開著遊戲就停，Esc 或 Space 關掉就接著玩'
      - 'tdp #7：原本 tdp menu.4、K11 要模式的 Space menu 列模式本身的鍵，tetru 暫時照列（TODO(tdp #7)）。使用者 2026-11-11 把 #7 改成問 app 自己的模式，選 A：tdp ce91c53 定案（K11 的 app 自己的模式的 Space menu、K11-15，還沒發版），列什麼 app 可以自行決定；要守的：Space 照樣打開、至少一列，標題與樣子照 menu.4，模式的每個鍵照樣在 ?，footer 照舊。tgo v1.2.4-beta.1 的 ModeKey.NoMenu、Mode.NoLeaveRow 做到（2026-11-12）。harness 讀的還是 tdp v1.2.3：K11-1、menu-23（分兩區）、menu-26（離開那一列）照舊寫一般的模式，等 tdp 發版再拿新版對'
      - 'Gaming 模式加兩個鍵（模式的鍵 app 可以自行決定，tdp K11）：r Restart（start over from level 1，跟 PLAYGROUND 的 [n]ew game 一樣：值得記的（task 7）先問誰玩的，不然直接重開）；s Save（keep this game and quit; it goes on next time，task 16）。footer 寫 r:restart s:save；放不下時 tgo 先收掉中間的鍵，Esc:pause 留著（60 欄時就是這樣）。r、s 不給玩家設成玩的鍵（task 13）'
      - '遊戲只在 Gaming 裡、沒有任何 popup、終端機不比最低尺寸小時才走；toast 不是 popup，不擋'
      - '有沒有東西蓋在畫面上用 tgo App.Covered()（popup 開著、收起動畫播到一半、splash 開著都算，toast 不算；tgo #3 回報後 v1.2.3 加的）'
