      - '存的是落地的格子（使用者 2026-11-11：panel 1 已經落地的格子）：正在掉的方塊、接下來的方塊不存。消行動畫還沒做完時存，存的是做完之後的樣子'
      - 'Save 在兩個地方：玩的時候是 Play 模式的 s（task 5，模式的 Space menu 裡的 [s]ave）；暫停時是 GAME 的 panel operation [s]ave，沒有一局在玩時停用（tdp M2、M6）。說明都是 keep this game and quit; it goes on next time'
      - '按了不先問（tdp F6：哪些要確認 app 可以自行決定；存了這一局，沒有東西會丟）：寫好就離開，這一局不記排行（下次接著玩、結束時才記，同一局只記一筆）；App Log 記一筆 Success。寫不進去：開 error popup（tdp note）Can''t save the game，路徑與原因，不離開'
      - '啟動時有 game.yaml：接著那一局，停在暫停（GAME 的 hint Enter:resume），關卡、行數、分數照存的，地上的格子都畫成白色（#ffffff，使用者 2026-11-11：不用分色），方塊從新的一袋來。讀進來就刪掉 game.yaml（使用者選的），之後跟一般的一局一樣結束、記分；App Log 記一筆 Info（tdp note.7）'
      - 'game.yaml 讀不了（YAML 錯、列數或寬度不對、有 # 與 . 以外的字、關卡不在 1 到 10、行數或分數是負的）：照 tdp E3 用 tgo App.MoveAside 問要不要移成 game.yaml.bak，Enter 移開、從沒有存檔開始，Esc 離開；設定、排行的檔也讀不了時排在它們後面問。讀進來之後刪不掉：開 error popup Can''t remove the game saved，說下次啟動還會再接一次'
      - '存了離開之後，main 在 Run 結束後不再把它記成 ANON（task 7）'
